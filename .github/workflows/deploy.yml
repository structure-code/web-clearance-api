name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_KEY }}
          script: |
            cd ~/web-clearance-api

            git pull origin main

            rm -rf node_modules
            rm -rf dist

            pnpm install --frozen-lockfile

            npx prisma generate
            npx prisma migrate deploy

            pnpm build

            pm2 delete web-clearance-api || true
            pm2 start dist/src/main.js --name web-clearance-api
            pm2 save
